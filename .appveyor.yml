# appveyor.yml
---
environment:
  # We only request a subset of the total Tox test matrix, here
  matrix:
  - TOXENV: py310-django4_0
    PYTHON: "3.10"
  - TOXENV: py312-django4_2
    PYTHON: "3.12"
  - TOXENV: py312-django5_1
    PYTHON: "3.12"
  - TOXENV: py312-nocontribcomments
    PYTHON: "3.12"
  - TOXENV: py313-django5_1
    PYTHON: "3.13"
  - TOXENV: py314-nocontribcomments
    PYTHON: "3.14"

stack: python %PYTHON%

build: off

image: Ubuntu2404

install:
- python -m pip install -U setuptools importlib-metadata tox

test_script:
- python -m tox